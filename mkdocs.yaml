site_name: "mongospecs"
site_url: "https://jaykv.github.io/mongospecs/"
repo_url: "https://github.com/jaykv/mongospecs"
edit_uri: "edit/main/docs/"

theme:
  name: "material"
  features:
  - announce.dismiss
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to light mode

markdown_extensions:
- abbr
- attr_list
- admonition
- footnotes
- md_in_html
- pymdownx.blocks.admonition
- pymdownx.blocks.details
- pymdownx.blocks.tab:
    alternate_style: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.magiclink
- pymdownx.snippets:
    base_path: ["."]
    check_paths: true
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.tasklist:
    custom_checkbox: true

plugins:
  search:

nav:
- Home: index.md
- Getting started: tutorial.md
- Guide:
  - Models: guide/models.md
  - Choosing a backend: guide/backends.md
  - Queries: guide/queries.md
  - Writes and transactions: guide/writes.md
  - Relations: guide/relations.md
  - Hooks and plugins: guide/plugins.md
  - Errors: guide/errors.md
  - Running in production: guide/operations.md
  - Tuning for production: guide/production.md
- Web:
  - Resources: web/resources.md
  - Authentication and authorization: web/auth.md
  - Testing your API: web/testing.md
  - Plugs: web/plugs.md
- Benchmarks: benchmarks.md
- Coming from Mongoose: parity.md
- Migrating from 0.1.x:
  - Guide: migration.md
  - v1 test inventory: v1-test-inventory.md
