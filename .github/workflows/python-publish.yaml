# Publishes whichever distribution the release tag names:
#   mongospecs-v0.2.0      -> packages/mongospecs
#   mongospecs-web-v0.2.0  -> packages/mongospecs-web
# The two packages are versioned and released independently.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    # Nothing is published from a commit that does not pass the checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make up
      - run: uv sync --all-packages --python 3.13
      - run: make lint
      - run: make types
      - run: uv run pytest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pick the package from the tag
        id: pick
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            mongospecs-web-v*) echo "package=mongospecs-web" >> "$GITHUB_OUTPUT" ;;
            mongospecs-v*) echo "package=mongospecs" >> "$GITHUB_OUTPUT" ;;
            *) echo "unrecognised release tag: $tag" >&2; exit 1 ;;
          esac
      - name: The tag must be the version being published
        run: |
          package="${{ steps.pick.outputs.package }}"
          declared="$(uv run --no-project python -c "import tomllib, sys; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "packages/$package/pyproject.toml")"
          tagged="${GITHUB_REF_NAME#"$package"-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, but packages/$package/pyproject.toml says $declared" >&2
            exit 1
          fi
      - run: uv build --package ${{ steps.pick.outputs.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
