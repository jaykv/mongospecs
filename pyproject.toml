[project]
name = "mongospecs-workspace"
version = "0.0.0"
description = "Workspace root for mongospecs and mongospecs-web. Not published."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "bench"]

[tool.uv.sources]
mongospecs = { workspace = true }
mongospecs-web = { workspace = true }
mongospecs-bench = { workspace = true }

[dependency-groups]
dev = [
    "mongospecs[all]",
    "mongospecs-web[all]",
    "mongospecs-bench",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.20",
    "sentry-sdk>=2.0",
    "openapi-spec-validator>=0.7",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["packages/mongospecs/tests", "packages/mongospecs-web/tests", "bench/tests", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "sharded: needs the sharded cluster from docker/compose.sharded.yaml",
    "chaos: steps the replica set primary down while the system is under load",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["packages/mongospecs/src", "packages/mongospecs-web/src", "bench/src", "examples/todo_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "RUF"]
"examples/**" = ["B", "RUF"]
# Benchmarks define closures inside loops and call them before the next iteration.
"bench/**" = ["B023"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = ["packages/mongospecs/src", "packages/mongospecs-web/src", "bench/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
