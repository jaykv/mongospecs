name: CI

# Changes that touch only documentation do not start this pipeline; docs.yaml checks those with
# one job (it builds the site and runs the examples the pages contain).
on:
  # Branches are tested through their pull request; a push trigger for them too ran every job twice.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "claudedocs/**"
      - "mkdocs.yaml"
      - "LICENSE"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "claudedocs/**"
      - "mkdocs.yaml"
      - "LICENSE"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --python 3.13
      - run: make lint
      - run: make types
      - run: make build
      - run: make docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        mongo: ["8.0"]
        experimental: [false]
        include:
          - python: "3.11"
            mongo: "7.0"
            experimental: false
          - python: "3.13"
            mongo: "7.0"
            experimental: false
          - python: "3.15"
            mongo: "7.0"
            experimental: false
          - python: "3.14t"
            mongo: "8.0"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      MONGO_VERSION: ${{ matrix.mongo }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start MongoDB (replica set and sharded cluster)
        run: make up
      - run: uv sync --all-packages --python ${{ matrix.python }}
      - run: uv run pytest
      - name: Container logs
        if: failure()
        run: |
          docker compose -f docker/compose.rs.yaml logs --tail 100
          docker compose -f docker/compose.sharded.yaml logs --tail 100

  tracing:
    # End to end: Sentry SDK -> mongospecs-web -> MongoDB, received by a Sentry-compatible server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: docker compose -f docker/compose.rs.yaml up -d --wait
      - run: docker compose -f docker/compose.rustrak.yaml up -d
      - run: uv sync --all-packages --python 3.13
      - name: Wait for rustrak
        run: timeout 60 sh -c 'until curl -sf http://localhost:8787/health >/dev/null; do sleep 1; done'
      - run: uv run mongospecs-bench trace
