site_name: "mongospecs"

theme:
  name: "material"
  features:
  - announce.dismiss
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to light mode

markdown_extensions:
- abbr
- attr_list
- admonition
- footnotes
- md_in_html
- pymdownx.blocks.admonition
- pymdownx.blocks.details
- pymdownx.blocks.tab:
    alternate_style: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.magiclink
- pymdownx.snippets:
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.tasklist:
    custom_checkbox: true

plugins:
  search:
  mkdocstrings:
    handlers:
      python:
        paths: [packages/mongospecs/src, packages/mongospecs-web/src]
        options:
          docstring_section_style: list
          filters: ["!^_"]
          heading_level: 2
          merge_init_into_class: true
          separate_signature: true
          show_root_heading: false
          show_signature_annotations: true
          show_source: false
          signature_crossrefs: true

nav:
- Home: index.md
- Guide:
  - Models: guide/models.md
  - Queries: guide/queries.md
  - Writes and transactions: guide/writes.md
  - Relations: guide/relations.md
  - Hooks and plugins: guide/plugins.md
  - Running in production: guide/operations.md
  - Tuning for production: guide/production.md
- Web:
  - Resources: web/resources.md
  - Plugs: web/plugs.md
- Benchmarks: benchmarks.md
- Coming from Mongoose: parity.md
- Migrating from 0.1.x:
  - Guide: migration.md
  - v1 test inventory: v1-test-inventory.md
- Reference:
  - mongospecs:
    - registry: reference/registry.md
    - model: reference/model.md
    - manager: reference/manager.md
    - query: reference/query.md
    - expr: reference/expr.md
    - updates: reference/updates.md
    - bulk: reference/bulk.md
    - markers: reference/markers.md
    - refs: reference/refs.md
    - relations: reference/relations.md
    - indexes: reference/indexes.md
    - hooks: reference/hooks.md
    - streams: reference/streams.md
    - errors: reference/errors.md
  - mongospecs-web:
    - resource: reference/web_resource.md
    - api: reference/web_api.md
    - backend: reference/web_backend.md
    - filters: reference/web_filters.md
    - policy: reference/web_policy.md
    - errors: reference/web_errors.md
    - openapi: reference/web_openapi.md
    - testing: reference/web_testing.md
