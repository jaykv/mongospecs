# Publishes the documentation site to GitHub Pages from main.
# Requires Settings > Pages > Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "examples/**", "zensical.toml", ".github/workflows/docs.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group docs --python 3.13
      - run: uv run --group docs zensical build --clean
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
