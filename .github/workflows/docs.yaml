# Publishes the documentation site to GitHub Pages (the gh-pages branch) from main.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "examples/**", "mkdocs.yaml", ".github/workflows/docs.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group docs --python 3.13
      - run: uv run --group docs mkdocs gh-deploy --strict --force
