[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mongospecs-bench"
version = "0.0.0"
description = "Benchmarks and stress scenarios for mongospecs against real MongoDB. Not published."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["mongospecs[all]", "mongospecs-web[all]", "httpx>=0.27"]

[project.scripts]
mongospecs-bench = "mongospecs_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mongospecs_bench"]
